# Compila la app de iPhone en un Mac de GitHub (con la última versión de Xcode).
# - Siempre: compila para el simulador, para verificar que todo funcione (no necesita cuenta de Apple).
# - Si están los secretos de App Store Connect: firma la app y la sube sola a TestFlight. Ver app/README.md.
name: App iPhone

on:
  push:
    branches: [main]
    paths: ['docs/**', 'app/**', '.github/workflows/app-ios.yml']
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      SUBIR_TESTFLIGHT: ${{ secrets.APPSTORE_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Preparar la app con el sitio
        working-directory: app
        run: |
          npm ci
          npm run web
          npx cap sync ios

      - name: Compilar para el simulador (verificación)
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 30
          cd build/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/app-simulador.zip" App.app

      - name: Guardar app para simulador
        uses: actions/upload-artifact@v4
        with:
          name: app-iphone-simulador-${{ github.run_number }}
          path: app-simulador.zip

      - name: Firmar y subir a TestFlight
        if: ${{ env.SUBIR_TESTFLIGHT == 'true' }}
        working-directory: app/ios/App
        env:
          APPSTORE_KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPSTORE_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$APPSTORE_KEY_ID" -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID")
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.0 \
            "${AUTH[@]}" archive | tail -n 30
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
