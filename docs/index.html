<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arriendo en CL · Parcelas, departamentos y cabañas en Chile</title>
  <meta name="description" content="Arrienda parcelas, departamentos, casas y cabañas por noche en todo Chile. Reserva directo por WhatsApp.">
  <meta property="og:title" content="Arriendo en CL">
  <meta property="og:description" content="Parcelas, departamentos y cabañas para arrendar en todo Chile. Reserva directo por WhatsApp.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="inicio">
<header class="top"></header>
<main>
  <section class="hero">
    <h1>Parcelas, departamentos y cabañas <br>para arrendar en todo Chile</h1>
    <p>Desde el desierto de Atacama hasta la Patagonia. Elige tus fechas y reserva directo por WhatsApp.</p>
  </section>

  <form class="search" id="filtros" role="search">
    <label>Región <select name="region"><option value="">Todo Chile</option></select></label>
    <label>Comuna <select name="comuna"><option value="">Todas</option></select></label>
    <label>Tipo <select name="tipo"><option value="">Todos</option></select></label>
    <label>Llegada <input type="date" name="llegada" data-llegada></label>
    <label>Salida <input type="date" name="salida" data-salida></label>
    <button type="button" class="btn ghost mas-filtros" aria-expanded="false" aria-controls="filtros">Más filtros</button>
    <label class="extra">Huéspedes <input type="number" name="huespedes" min="1" max="50" placeholder="2"></label>
    <label class="extra">Máx. por noche <select name="precio_max">
      <option value="">Sin límite</option><option value="50000">$50.000</option><option value="75000">$75.000</option>
      <option value="100000">$100.000</option><option value="150000">$150.000</option></select></label>
    <label class="grow extra">Buscar <input type="search" name="texto" placeholder="tinaja, lago, playa…"></label>
    <label class="extra">Ordenar <select name="orden"></select></label>
    <button type="reset" class="btn ghost extra">Limpiar</button>
  </form>

  <div class="resultados-head">
    <h2 id="conteo" aria-live="polite"></h2>
  </div>

  <div class="explorar" id="explorar">
    <div class="grid" id="lista"></div>
    <div class="mapa-wrap"><div id="mapa" aria-label="Mapa de propiedades"></div></div>
  </div>
  <button type="button" class="btn toggle-mapa" id="toggle-mapa" aria-controls="explorar">🗺️ Ver mapa</button>
</main>
<footer class="bottom"></footer>

<script src="config.js"></script>
<script src="data/propiedades.js"></script>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/catalogo.js"></script>
<script src="js/whatsapp.js"></script>
<script src="js/ui.js"></script>
<script src="js/inicio.js"></script>
</body>
</html>
